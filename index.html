<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad Tuba Pro</title>
    
    <link rel="apple-touch-icon" href="tuba.png">
    <link rel="icon" href="tuba.ico">

    <style>
        /* ローカルフォント（すべてセリフ体） */
        @font-face {
            font-family: 'PlayfairDisplay';
            src: url('PlayfairDisplay-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }
        @font-face {
            font-family: 'NotoSerifJP';
            src: url('NotoSerifJP-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'NotoSerifJP';
            src: url('NotoSerifJP-Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        :root {
            /* 真鍮カラーの定義 */
            --brass-light: #fcebb6;
            --brass-base: #d4af37;
            --brass-mid: #b58d19;
            --brass-dark: #8b6e22;
            --brass-shadow: #5a4512;
            --btn-height: 80px; 
        }
        
        * {
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }
        
        body {
            /* すべてセリフ体に統一 */
            font-family: 'PlayfairDisplay', 'NotoSerifJP', serif;
            background: #1a0b00; /* マホガニー風の深い色 */
            color: #333;
            margin: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            overflow: hidden;
            position: fixed;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            padding-top: env(safe-area-inset-top);
        }

        #app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* -------------------------------------
           プレイゾーン（ベルベット風クッション＋真鍮枠）
        ------------------------------------- */
        #play-zone {
            flex: 1;
            background: radial-gradient(circle at center, #4a1515, #140404);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 8px ridge var(--brass-dark);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
            cursor: pointer;
            order: 1;
        }
        #play-zone::after {
            content: "LIP SLUR ZONE\A (Slide Up & Down)";
            white-space: pre-wrap;
            text-align: center;
            color: rgba(212, 175, 55, 0.3);
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9), -1px -1px 1px rgba(255,255,255,0.1);
            pointer-events: none;
        }

        /* -------------------------------------
           情報パネル（真鍮プレート風）
        ------------------------------------- */
        #info-panel {
            width: 320px;
            background: linear-gradient(135deg, #e2c779, #b89435, #8b6e22);
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-left: 2px solid rgba(255,255,255,0.4);
            border-right: 2px solid rgba(0,0,0,0.6);
            box-shadow: inset 0 0 30px rgba(90, 69, 18, 0.6);
            z-index: 10;
            order: 2;
            position: relative;
        }

        /* パネル四隅のマイナスネジ */
        .screw {
            position: absolute;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--brass-light), var(--brass-dark));
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.8), 0 2px 4px rgba(0,0,0,0.6);
        }
        .screw::after {
            content: '';
            position: absolute;
            top: 50%; left: 15%; width: 70%; height: 2px;
            background: rgba(0,0,0,0.8);
            transform: translateY(-50%) rotate(45deg);
            box-shadow: 0 1px 0 rgba(255,255,255,0.3);
        }
        .top-left { top: 12px; left: 12px; }
        .top-right { top: 12px; right: 12px; transform: rotate(20deg); }
        .bottom-left { bottom: 12px; left: 12px; transform: rotate(-30deg); }
        .bottom-right { bottom: 12px; right: 12px; transform: rotate(60deg); }

        #top-controls {
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        /* エッチング（彫り込み）風の文字 */
        #freq-display {
            height: 30px;
            font-size: 1.4rem;
            color: #4a3818;
            text-align: center;
            font-weight: bold;
            line-height: 30px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.6), 0 -1px 0 rgba(0,0,0,0.2);
            z-index: 2;
        }
        #note-name-container {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            z-index: 2;
        }
        #note-name {
            font-size: 3.5rem;
            font-weight: bold;
            color: #3a2a0a;
            text-shadow: 0 1px 0 rgba(255,255,255,0.6), 0 -1px 0 rgba(0,0,0,0.2);
        }

        /* 古い羊皮紙風の楽譜エリア */
        #staff-container {
            background: radial-gradient(circle at center, #fdf6e3, #e1d3a5);
            height: calc(100vh - 200px);
            border-radius: 4px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(100, 70, 20, 0.4), 0 5px 10px rgba(0,0,0,0.3);
            border: 2px solid var(--brass-shadow);
            overflow: hidden;
            z-index: 2;
        }

        /* -------------------------------------
           ピストンエリア（黒いシリンダー風）
        ------------------------------------- */
        #piston-zone {
            width: 220px;
            background: linear-gradient(to right, #2a2a2a, #0a0a0a, #2a2a2a);
            border-left: 6px groove #444;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            order: 3;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* 立体的な真鍮のピストン（トップに白蝶貝風の装飾） */
        .piston-btn {
            width: 85%;
            height: var(--btn-height); 
            margin: 12px 0;
            background: linear-gradient(to bottom, var(--brass-light), var(--brass-base) 40%, var(--brass-mid) 60%, var(--brass-dark));
            border: 1px solid var(--brass-shadow);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: bold;
            position: relative;
            box-shadow: 
                inset 0 1px 2px rgba(255,255,255,0.9),
                0 15px 0 #54400f, 
                0 15px 15px rgba(0,0,0,0.8);
            transition: transform 0.05s, box-shadow 0.05s;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* 白蝶貝（パール）のトップ */
        .piston-btn::before {
            content: '';
            position: absolute;
            top: 6%; left: 4%; width: 92%; height: 88%;
            background: radial-gradient(circle at top left, #fff, #f0f0f0 40%, #d0d0d0);
            border-radius: 8px;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.2), 0 2px 2px rgba(255,255,255,0.9);
            z-index: 1;
        }

        .piston-btn span {
            position: relative;
            z-index: 2;
            color: #222;
            text-shadow: 0 1px 0 #fff;
        }
        
        .piston-btn.active {
            transform: translateY(12px);
            box-shadow: 
                inset 0 1px 2px rgba(255,255,255,0.9),
                0 3px 0 #54400f, 
                0 4px 5px rgba(0,0,0,0.8);
        }

        /* -------------------------------------
           設定ボタン＆モーダル
        ------------------------------------- */
        .settings-open-btn {
            background: linear-gradient(to bottom, #ece0b9, var(--brass-base));
            color: #3a2a0a;
            border: 1px solid var(--brass-shadow);
            padding: 8px 24px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #6b5314, 0 6px 6px rgba(0,0,0,0.5);
            text-shadow: 0 1px 0 rgba(255,255,255,0.6);
            font-family: inherit;
        }
        .settings-open-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #6b5314, 0 1px 2px rgba(0,0,0,0.5);
        }

        #settings-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #settings-modal.show {
            display: flex;
        }

        /* 木箱と真鍮のプレート風モーダル */
        .modal-content {
            background: radial-gradient(circle at center, #381e10, #140904);
            padding: 30px;
            border-radius: 8px;
            width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,1);
            border: 6px ridge var(--brass-dark);
            color: #e6cd7a;
        }
        .modal-content h2 {
            margin-top: 0;
            text-align: center;
            color: var(--brass-light);
            text-shadow: 0 -1px 2px #000, 0 1px 1px rgba(255,255,255,0.2);
            border-bottom: 2px groove var(--brass-dark);
            padding-bottom: 10px;
        }
        
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 0 2px 2px #000;
        }

        /* アナログミキサーのフェーダー風スライダー */
        input[type=range] {
            -webkit-appearance: none;
            width: 55%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 12px;
            background: #0a0a0a;
            border-radius: 6px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid #000;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 30px; width: 20px;
            border-radius: 3px;
            background: linear-gradient(to bottom, var(--brass-light), var(--brass-dark));
            border: 1px solid #221100;
            box-shadow: inset 0 1px 1px #fff, 0 4px 6px rgba(0,0,0,0.8);
            margin-top: -10px;
            background-image: linear-gradient(0deg, transparent 45%, rgba(0,0,0,0.6) 45%, rgba(0,0,0,0.6) 55%, transparent 55%);
            cursor: pointer;
        }

        /* 機械的なトグルスイッチ */
        .switch {
            position: relative; display: inline-block;
            width: 60px; height: 28px;
            background: #111;
            border-radius: 4px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid #000;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 4px;
            transition: .3s;
        }
        .slider:before {
            position: absolute; content: "";
            height: 22px; width: 28px;
            left: 2px; bottom: 2px;
            background: linear-gradient(to bottom, var(--brass-base), var(--brass-dark));
            border: 1px solid var(--brass-shadow);
            border-radius: 2px;
            box-shadow: inset 0 1px 1px var(--brass-light), 0 2px 4px rgba(0,0,0,0.8);
            background-image: repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(0,0,0,0.3) 4px, rgba(0,0,0,0.3) 5px);
            transition: .3s;
        }
        input:checked + .slider:before { transform: translateX(28px); }

        .close-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to bottom, #882222, #440000);
            color: #ffcccc;
            border: 2px solid #220000;
            box-shadow: inset 0 1px 1px #cc5555, 0 5px 0 #220000, 0 6px 6px rgba(0,0,0,0.6);
            border-radius: 6px;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 15px;
            text-shadow: 0 -1px 0 rgba(0,0,0,0.8);
            font-family: inherit;
        }
        .close-btn:active {
            transform: translateY(5px);
            box-shadow: inset 0 1px 1px #cc5555, 0 0 0 #220000, 0 1px 2px rgba(0,0,0,0.6);
        }

        svg { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="play-zone"></div>

        <div id="info-panel">
            <div class="screw top-left"></div>
            <div class="screw top-right"></div>
            <div class="screw bottom-left"></div>
            <div class="screw bottom-right"></div>

            <div id="top-controls">
                <button class="settings-open-btn" id="open-settings">Settings</button>
            </div>
            <div id="freq-display">--- Hz</div>
            <div id="note-name-container"><div id="note-name">---</div></div>
            
            <div id="staff-container">
                <svg id="staff-svg" viewBox="0 0 200 350" preserveAspectRatio="xMidYMid meet">
                    <!-- 五線 -->
                    <line x1="10" y1="80" x2="190" y2="80" stroke="#4a3818" stroke-width="1.5" />
                    <line x1="10" y1="100" x2="190" y2="100" stroke="#4a3818" stroke-width="1.5" />
                    <line x1="10" y1="120" x2="190" y2="120" stroke="#4a3818" stroke-width="1.5" />
                    <line x1="10" y1="140" x2="190" y2="140" stroke="#4a3818" stroke-width="1.5" />
                    <line x1="10" y1="160" x2="190" y2="160" stroke="#4a3818" stroke-width="1.5" />
                    <text x="15" y="145" font-size="100" fill="#3a2a0a" font-family="serif" pointer-events="none">𝄢</text>
                    
                    <g id="ledger-lines"></g>
                    <text id="flat-sign" x="75" y="0" font-size="36" fill="#2a1a05" font-family="serif" style="display:none;" pointer-events="none">♭</text>
                    <ellipse id="note-head" cx="120" cy="150" rx="11" ry="8" fill="#2a1a05" style="display:none;"/>
                </svg>
            </div>
        </div>

        <div id="piston-zone">
            <!-- spanタグを追加して白蝶貝の上に文字を乗せる -->
            <div id="btn-1" class="piston-btn" data-piston="h"><span>1</span></div>
            <div id="btn-2" class="piston-btn" data-piston="u"><span>2</span></div>
            <div id="btn-3" class="piston-btn" data-piston="i"><span>3</span></div>
            <div id="btn-4" class="piston-btn" data-piston="l"><span>4</span></div>
        </div>
    </div>

    <!-- 設定モーダル -->
    <div id="settings-modal">
        <div class="modal-content">
            <h2>Settings</h2>
            
            <div class="setting-row">
                <span>Piston Height</span>
                <input type="range" id="size-slider" min="50" max="140" value="80">
            </div>

            <div class="setting-row">
                <span>Piston on Left</span>
                <label class="switch">
                    <input type="checkbox" id="layout-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-row">
                <span>Reverse Order</span>
                <label class="switch">
                    <input type="checkbox" id="reverse-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-row">
                <span>Slide X-Axis Vol.</span>
                <label class="switch">
                    <input type="checkbox" id="x-vol-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <button class="close-btn" id="close-settings">Close</button>
        </div>
    </div>

<script>
document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
    const now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
}, { passive: false });
document.addEventListener('dblclick', (e) => { e.preventDefault(); }, { passive: false });

const modal = document.getElementById('settings-modal');
document.getElementById('open-settings').addEventListener('click', () => modal.classList.add('show'));
document.getElementById('close-settings').addEventListener('click', () => modal.classList.remove('show'));

document.getElementById('size-slider').addEventListener('input', (e) => {
    document.documentElement.style.setProperty('--btn-height', e.target.value + 'px');
});

document.getElementById('layout-toggle').addEventListener('change', (e) => {
    const playZone = document.getElementById('play-zone');
    const pistonZone = document.getElementById('piston-zone');
    if (e.target.checked) {
        pistonZone.style.order = "1";
        playZone.style.order = "3";
    } else {
        playZone.style.order = "1";
        pistonZone.style.order = "3";
    }
});

document.getElementById('reverse-toggle').addEventListener('change', (e) => {
    document.getElementById('piston-zone').style.flexDirection = e.target.checked ? 'column-reverse' : 'column';
});

const xVolToggle = document.getElementById('x-vol-toggle');

let audioCtx = null;
let masterGain = null;
let oscillators = [];
let formantFilter = null;
let isAudioUnlocked = false;

const baseFreq = 29.135; 
const semitoneRatio = Math.pow(2, 1/12);

const activePistons = { h: false, u: false, i: false, l: false };
const pistonPointers = { h: null, u: null, i: null, l: null };
let isPlaying = false;
let activePlayPointerId = null; 

let currentX = 0;
let currentY = 0.5;
let lastHarmonic = -1;
let lastDrops = -1;
let lastRenderedFreq = -1;

function ensureAudioContext() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function unlockAudio() {
    if (isAudioUnlocked) return;
    ensureAudioContext();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    gain.gain.value = 0;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(0);
    osc.stop(audioCtx.currentTime + 0.001);
    isAudioUnlocked = true;
}
document.addEventListener('touchstart', unlockAudio, { once: true });
document.addEventListener('pointerdown', unlockAudio, { once: true });

function initAudio() {
    ensureAudioContext();
    if (masterGain) return;
    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
    formantFilter = audioCtx.createBiquadFilter();
    formantFilter.type = 'lowpass';
    formantFilter.frequency.setValueAtTime(450, audioCtx.currentTime);

    for (let i = 0; i < 5; i++) {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sawtooth';
        g.gain.setValueAtTime(i === 0 ? 0.8 : 0.4 / Math.pow(i + 1, 1.5), audioCtx.currentTime);
        osc.connect(g);
        g.connect(formantFilter);
        oscillators.push(osc);
        osc.start();
    }
    formantFilter.connect(masterGain);
    masterGain.connect(audioCtx.destination);
}

const playZone = document.getElementById('play-zone');
function updatePointerCoordinates(e) {
    const rect = playZone.getBoundingClientRect();
    currentY = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
    currentX = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
}

function updateSynth() {
    if (!audioCtx || !masterGain) return;
    ensureAudioContext();

    if (!isPlaying) {
        masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
        masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
        updateStaff(0);
        lastHarmonic = -1;
        return;
    }

    const harmonic = Math.max(1, Math.min(8, Math.round((1 - currentY) * 7 + 1)));
    let targetVol = 1.6;
    if (xVolToggle.checked) {
        targetVol = 1.6 * (1.0 - currentX); 
        if (targetVol < 0.1) targetVol = 0.1;
    }

    masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
    masterGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.02);

    let drops = 0;
    if (activePistons.u) drops += 1;
    if (activePistons.h) drops += 2;
    if (activePistons.i) drops += 3;
    if (activePistons.l) drops += 5;

    if (harmonic === lastHarmonic && drops === lastDrops) return;
    lastHarmonic = harmonic;
    lastDrops = drops;

    const freq = (baseFreq * harmonic) / Math.pow(semitoneRatio, drops);
    oscillators.forEach((osc, i) => {
        osc.frequency.setValueAtTime(osc.frequency.value, audioCtx.currentTime);
        osc.frequency.setTargetAtTime(freq * (i + 1), audioCtx.currentTime, 0.015);
    });

    document.getElementById('freq-display').innerText = freq.toFixed(2) + " Hz";
    updateStaff(freq);
}

playZone.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (activePlayPointerId !== null) return; 
    initAudio();
    activePlayPointerId = e.pointerId;
    playZone.setPointerCapture(e.pointerId);
    isPlaying = true;
    updatePointerCoordinates(e);
    updateSynth();
});

playZone.addEventListener('pointermove', (e) => {
    e.preventDefault();
    if (!isPlaying || e.pointerId !== activePlayPointerId) return;
    updatePointerCoordinates(e);
    updateSynth();
});

function stopPlay(pointerId) {
    if (pointerId === undefined || activePlayPointerId === pointerId) {
        activePlayPointerId = null;
        isPlaying = false;
        try { if(pointerId !== undefined) playZone.releasePointerCapture(pointerId); } catch(e){}
        updateSynth();
    }
}

document.querySelectorAll('.piston-btn').forEach(btn => {
    const p = btn.dataset.piston;
    btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        initAudio();
        btn.setPointerCapture(e.pointerId);
        pistonPointers[p] = e.pointerId;
        activePistons[p] = true;
        btn.classList.add('active');
        if (isPlaying) { lastDrops = -1; updateSynth(); }
    });
});

function releasePiston(p, pointerId) {
    if (pistonPointers[p] === pointerId) {
        pistonPointers[p] = null;
        activePistons[p] = false;
        const btn = document.querySelector(`.piston-btn[data-piston="${p}"]`);
        btn.classList.remove('active');
        try { btn.releasePointerCapture(pointerId); } catch(e){}
        if (isPlaying) { lastDrops = -1; updateSynth(); }
    }
}

window.addEventListener('pointerup', (e) => {
    stopPlay(e.pointerId);
    Object.keys(pistonPointers).forEach(p => releasePiston(p, e.pointerId));
});
window.addEventListener('pointercancel', (e) => {
    stopPlay(e.pointerId);
    Object.keys(pistonPointers).forEach(p => releasePiston(p, e.pointerId));
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        stopPlay();
        Object.keys(pistonPointers).forEach(p => {
            if (pistonPointers[p] !== null) releasePiston(p, pistonPointers[p]);
        });
    }
});

function updateStaff(freq) {
    if (Math.abs(freq - lastRenderedFreq) < 0.1) return;
    lastRenderedFreq = freq;

    const noteHead = document.getElementById('note-head');
    const ledgerGroup = document.getElementById('ledger-lines');
    const noteText = document.getElementById('note-name');
    const flatSign = document.getElementById('flat-sign');
    
    if (!isPlaying || freq < 10) {
        noteHead.style.display = 'none';
        flatSign.style.display = 'none';
        while (ledgerGroup.firstChild) ledgerGroup.removeChild(ledgerGroup.firstChild);
        noteText.innerHTML = "---";
        lastRenderedFreq = -1; 
        return;
    }
    noteHead.style.display = 'block';

    const n = Math.round(12 * Math.log2(freq / 440) + 69);
    const diatonicSteps = [0, 1, 1, 2, 2, 3, 4, 4, 5, 5, 6, 6];
    const isFlat = [false, true, false, true, false, false, true, false, true, false, true, false];
    const octave = Math.floor(n / 12) - 1;
    const pitchClass = n % 12;
    const step = octave * 7 + diatonicSteps[pitchClass];
    const stepOffset = step - 18; 
    const yPos = 160 - (stepOffset * 10);
    noteHead.setAttribute('cy', yPos);

    if (isFlat[pitchClass]) {
        flatSign.setAttribute('y', yPos + 12);
        flatSign.style.display = 'block';
    } else {
        flatSign.style.display = 'none';
    }

    const namesFlat = ["C", "D♭", "D", "E♭", "E", "F", "G♭", "G", "A♭", "A", "B♭", "B"];
    noteText.innerHTML = `${namesFlat[pitchClass]}<span style="font-size: 1.5rem;">${octave}</span>`;

    while (ledgerGroup.firstChild) ledgerGroup.removeChild(ledgerGroup.firstChild);
    for (let ly = 180; ly <= yPos + 5; ly += 20) drawLedger(ly, ledgerGroup);
    for (let ly = 60; ly >= yPos - 5; ly -= 20) drawLedger(ly, ledgerGroup);
}

function drawLedger(y, group) {
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", "100"); line.setAttribute("y1", y);
    line.setAttribute("x2", "140"); line.setAttribute("y2", y);
    line.setAttribute("stroke", "#4a3818"); line.setAttribute("stroke-width", "2");
    group.appendChild(line);
}
</script>
